name: refresh-prices

# Intraday price + computed-metrics refresh during US market hours.
# yfinance (default): ~15 min cadence, no API key.
# Massive free tier: 5 req/min → ~22 min for 104 symbols; set PRICE_SOURCE=massive
# and MASSIVE_API_KEY secret, and prefer workflow_dispatch or a daily cron.
on:
  schedule:
    - cron: "*/15 13-21 * * 1-5" # weekdays, 13:00-21:45 UTC (yfinance)
    - cron: "30 21 * * 1-5" # weekdays 21:30 UTC — daily EOD refresh (Massive free tier)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-prices
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt -r requirements-backend.txt

      - name: Refresh prices and metrics
        env:
          PRICE_SOURCE: ${{ vars.PRICE_SOURCE || 'yfinance' }}
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
        run: python -m src.jobs.refresh_prices

      - name: Commit snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "data: refresh prices ($(date -u +%Y-%m-%dT%H:%MZ)) [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin "${{ github.ref_name }}" \
              && git push && exit 0
            echo "push retry $i"; sleep $((RANDOM % 10 + 5))
          done
          echo "push failed after retries"; exit 1

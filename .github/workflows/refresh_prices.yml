name: refresh-prices

# Intraday price + computed-metrics refresh, ~every 15 min during US market hours.
# GitHub cron is UTC-only and best-effort (runs can be delayed/skipped under load),
# and it cannot model market holidays. The window 13:00-21:45 UTC covers 9:30-16:00
# ET under both EDT and EST; extra runs on holidays are harmless (yfinance just
# returns no new bars and the job tolerates that). yfinance needs no secret.
on:
  schedule:
    - cron: "*/15 13-21 * * 1-5" # weekdays, 13:00-21:45 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-prices
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Refresh prices and metrics
        run: python -m src.jobs.refresh_prices

      - name: Commit snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "data: refresh prices ($(date -u +%Y-%m-%dT%H:%MZ)) [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin "${{ github.ref_name }}" \
              && git push && exit 0
            echo "push retry $i"; sleep $((RANDOM % 10 + 5))
          done
          echo "push failed after retries"; exit 1

name: refresh-fundamentals

# Daily SEC EDGAR fundamentals refresh. Requires the SEC_USER_AGENT repo secret
# ("AppName contact@email"); EDGAR blocks requests without a descriptive UA.
on:
  schedule:
    - cron: "30 7 * * *" # daily 07:30 UTC (staggered before filings)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-fundamentals
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Refresh fundamentals
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python -m src.jobs.refresh_fundamentals

      - name: Commit snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "data: refresh fundamentals ($(date -u +%Y-%m-%dT%H:%MZ)) [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin "${{ github.ref_name }}" \
              && git push && exit 0
            echo "push retry $i"; sleep $((RANDOM % 10 + 5))
          done
          echo "push failed after retries"; exit 1

name: ci

# Test + lint gate on every push/PR. No secrets needed — the suite is network-free.
on:
  push:
    branches: ["**"]
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-backend.txt -r requirements-dev.txt
      - name: Ruff lint
        run: ruff check .
      - name: Pytest
        run: python -m pytest -q

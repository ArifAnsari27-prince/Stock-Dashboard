name: refresh-news

# Cached news headlines (Finnhub free tier) -> R2. Optional: the job exits
# cleanly when FINNHUB_API_KEY is unset, so this workflow is safe to leave
# enabled before the secret exists. Hourly during US market hours.
on:
  schedule:
    - cron: "15 13-21 * * 1-5" # weekdays, hourly 13:15-21:15 UTC
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: refresh-news
  cancel-in-progress: false

env:
  DATA_URI: ${{ vars.DATA_URI }}
  R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_REGION: ${{ vars.R2_REGION }}
  FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-backend.txt
      - name: Refresh news headlines
        run: python -m src.jobs.refresh_news

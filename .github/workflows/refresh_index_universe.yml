name: refresh-index-universe

# Weekly master universe (Nasdaq-100 + S&P 500 + Russell 1000/3000) -> R2.
# Requires R2 secrets/vars. No git commit — data is written to the object store.
on:
  schedule:
    - cron: "0 6 * * 0" # Sundays 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: refresh-index-universe
  cancel-in-progress: false

env:
  DATA_URI: ${{ vars.DATA_URI }}
  R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_REGION: ${{ vars.R2_REGION }}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-backend.txt
      - name: Refresh master universe
        run: python -m src.jobs.refresh_index_universe

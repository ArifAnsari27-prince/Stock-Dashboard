name: refresh-universe

# Weekly Nasdaq-100 constituent refresh. The Nasdaq API needs no secret.
on:
  schedule:
    - cron: "0 6 * * 0" # Sundays 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-universe
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt -r requirements-backend.txt

      - name: Refresh universe
        run: python -m src.jobs.refresh_universe

      - name: Commit snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "data: refresh universe ($(date -u +%Y-%m-%dT%H:%MZ)) [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin "${{ github.ref_name }}" \
              && git push && exit 0
            echo "push retry $i"; sleep $((RANDOM % 10 + 5))
          done
          echo "push failed after retries"; exit 1
